[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exploit-text-graph"
version = "0.1.0"
description = "Full-fidelity reference implementation of the NSF CAREER (Samtani) research thrusts: Diachronic Graph Transformer (RT1) and Context Transformer Encoder (RT2)."
requires-python = ">=3.10"
readme = "README.md"

dependencies = [
  "numpy>=1.24",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "pandas>=2.0",
  "networkx>=3.1",
  "torch>=2.1",
  "statsmodels>=0.14",
  "gensim>=4.3",
  "matplotlib>=3.7",
  "umap-learn>=0.5.4",
  "tqdm>=4.66",
  "rich>=13.5",
  "pydantic>=2.0",
  "pyarrow>=13.0",
  "Faker>=19.0",
  "spacy>=3.7",
  "jupyter>=1.0",
  "ipykernel>=6.25",
  "scrapling[all]>=0.4",
]

[project.optional-dependencies]
sentence-transformers = [
  "sentence-transformers>=2.2",
  "transformers>=4.35",
]
autoarima = [
  "pmdarima>=2.0",
]
scraper = [
  "scrapling[all]>=0.4",
]
# preprocessing extras — install with: pip install -e ".[preprocess]"
preprocess = [
  "langdetect>=1.0.9",   # language detection for borderline-ASCII posts
  "datasketch>=1.6",     # MinHash-LSH near-deduplication
  "ftfy>=6.1",           # optional Unicode fix-text (imported gracefully)
]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
